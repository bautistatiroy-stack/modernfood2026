<!DOCTYPE html>
<html>

<head>
    <title>Modern Cart</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
        
        body {
            background: #c77700;
            padding: 15px;
            padding-bottom: 120px;
        }
        /* HEADER */
        
        .topbar {
            background: linear-gradient(45deg, #007bff, #00c6ff);
            color: white;
            padding: 15px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .topbar h2 {
            font-size: 24px;
        }
        /* INFO */
        
        .info-box {
            background: white;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            line-height: 1.7;
        }
        /* GRID */
        
        .cart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }
        /* CARD */
        
        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            transition: 0.3s;
        }
        
        .card img:hover {
            transform: scale(1.05);
            filter: brightness(0.8);
        }
        
        .content {
            padding: 10px;
        }
        
        .name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 1px;
        }
        
        .price {
            color: green;
            margin-bottom: 5px;
            font-size: 1px;
        }
        
        .qty {
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .subtotal {
            font-weight: bold;
            font-size: 14px;
        }
        /* FOOTER */
        
        .total-box {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
        }
        
        .total-box h3 {
            font-size: 18px;
            color: #000000;
            background: rgb(6, 236, 221);
            border-radius: 10px;
            padding: 1px 1px;
        }
        
        .checkout-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #28a745, #00d26a);
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        /* EMPTY */
        
        .empty {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }
        /* MOBILE */
        
        @media(max-width:600px) {
            body {
                padding: 10px;
                padding-bottom: 140px;
            }
            .topbar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            .topbar h2 {
                font-size: 22px;
            }
            .cart-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .card img {
                height: 110px;
            }
            .content {
                padding: 10px;
            }
            .name {
                font-size: 14px;
            }
            .price,
            .qty,
            .subtotal {
                font-size: 12px;
            }
            .total-box {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            .checkout-btn {
                width: 100%;
            }
        }
        
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }
        
        .qty-controls button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: #5baff0;
            color: white;
            cursor: pointer;
        }
        
        .remove {
            margin-top: 8px;
            padding: 6px;
            width: 100%;
            border: none;
            border-radius: 8px;
            background: red;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="topbar">

        <h2>🛒 Shopping Cart</h2>

        <div>
            Ready for Checkout ✅
        </div>

    </div>

    <!-- CUSTOMER INFO -->
    <div class="info-box" id="info"></div>

    <!-- CART ITEMS -->
    <div class="cart-grid" id="cart"></div>

    <!-- TOTAL -->
    <div class="total-box">

        <h3>
            Total: ₱<span id="total">0</span>
        </h3>

        <button class="checkout-btn" onclick="goCheckout()">
            Checkout
        </button>
        <button class="checkout-btn" onclick="goShop()">
            back
 </button>
    </div>

    <script>
        function goShop() {
            window.location.href = "shop.html";
        }
        let products = JSON.parse(localStorage.getItem("products")) || [];
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let qty = JSON.parse(localStorage.getItem("qty")) || [];

        function save() {
            localStorage.setItem("cart", JSON.stringify(cart));
            localStorage.setItem("qty", JSON.stringify(qty));
        }

        function render() {

            let html = "";
            let total = 0;

            let cartItems = [];

            products.forEach((p, i) => {

                if (cart[i]) {

                    if (!qty[i] || qty[i] < 1) qty[i] = 1;

                    let subtotal = Number(p.price) * Number(qty[i]);
                    total += subtotal;

                    cartItems.push({
                        name: p.name,
                        price: p.price,
                        qty: qty[i],
                        subtotal: subtotal
                    });

                    html += `
            <div class="card">
                <img src="${p.img}">

                <div class="content">
                    <div class="name">${p.name}</div>
                    <div class="price">₱${p.price}</div>

                    <div class="qty-controls">
                        <button onclick="minus(${i})">-</button>
                        <span>${qty[i]}</span>
                        <button onclick="plus(${i})">+</button>
                    </div>

                    <div class="subtotal">
                        Subtotal: ₱${subtotal}
                    </div>

                    <button class="remove" onclick="removeItem(${i})">
                        Remove
                    </button>
                </div>
            </div>
            `;
                }
            });

            if (!html) {
                html = `
        <div class="empty">
            <h2>🛒 Your cart is empty</h2>
        </div>`;
            }

            document.getElementById("cart").innerHTML = html;
            document.getElementById("total").innerText = total;

            localStorage.setItem("total", total);
            localStorage.setItem("cartItems", JSON.stringify(cartItems));
        }

        function plus(i) {
            qty[i] = (qty[i] || 1) + 1;
            save();
            render();
        }

        function minus(i) {
            if (qty[i] > 1) {
                qty[i]--;
                save();
                render();
            }
        }

        function removeItem(i) {
            cart[i] = false;
            qty[i] = 0;
            save();
            render();
        }

        function goCheckout() {
            if (Number(document.getElementById("total").innerText) <= 0) {
                alert("Cart is empty!");
                return;
            }
            window.location.href = "checkout.html";
        }

        render();
    </script>

</body>

</html>
