<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, .6), rgba(0, 0, 0, .6)), url('https://th.bing.com/th/id/OIP.C8811Y490Y4l_MtSLtv84AHaEP');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        /* LOGIN BOX */
        
        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .08);
            color: #fff;
        }
        /* INPUT */
        
        .input-box {
            margin: 12px 0;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            outline: none;
        }
        /* BUTTON */
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .login-btn {
            background: linear-gradient(45deg, #ea580c, #fb923c);
            color: white;
        }
        
        .login-btn:hover {
            background: linear-gradient(45deg, #ad5f27, #216b44);
        }
        /* TYPING */
        
        .typing-box {
            margin-top: 15px;
            height: 25px;
            position: relative;
            font: size 10px;
        }
        
        .typing {
            position: absolute;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            border-right: 2px solid #fff;
        }
        
        .t1 {
            animation: type1 6s infinite;
            font: size 10px;
        }
        
        .t2 {
            animation: type2 6s infinite;
            font: size 7px;
        }
        
        .t3 {
            animation: type3 6s infinite;
            font: size 1px;
        }
        
        @keyframes type1 {
            0% {
                width: 0;
                opacity: 0
            }
            10% {
                opacity: 1
            }
            30% {
                width: 25ch;
                opacity: 1
            }
            40% {
                opacity: 0
            }
            100% {
                width: 0;
                opacity: 0
            }
        }
        
        @keyframes type2 {
            0% {
                width: 0;
                opacity: 0
            }
            35% {
                opacity: 0
            }
            45% {
                opacity: 1
            }
            65% {
                width: 25ch;
                opacity: 1
            }
            75% {
                opacity: 0
            }
            100% {
                width: 0;
                opacity: 0
            }
        }
        
        @keyframes type3 {
            0% {
                width: 0;
                opacity: 0
            }
            65% {
                opacity: 0
            }
            75% {
                opacity: 1
            }
            90% {
                width: 20ch;
                opacity: 1
            }
            100% {
                opacity: 0
            }
        }
        /* FLOATING ICONS */
        
        .snack {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: float 10s linear infinite;
        }
        
        @keyframes float {
            from {
                transform: translateY(0)
            }
            to {
                transform: translateY(-120vh)
            }
        }
    </style>
</head>

<body>

    <!-- FLOATING -->
    <div class="snack" style="left:10%">🍔</div>
    <div class="snack" style="left:30%;animation-delay:9S;">🍕</div>
    <div class="snack" style="left:50%;animation-delay:3s;">🍟</div>
    <div class="snack" style="left:70%;animation-delay:2s;">🍩</div>
    <div class="snack" style="left:30%;animation-delay:5s;">🍕</div>
    <div class="snack" style="left:50%;animation-delay:3s;">🍟</div>
    <div class="snack" style="left:70%;animation-delay:8s;">🍩</div>
    <div class="login-box">

        <h2>🍔 Food Client Login</h2>

        <div class="input-box">
            <input id="name" placeholder="Full Name">
        </div>

        <div class="input-box">
            <input id="address" placeholder="Address">
        </div>

        <div class="input-box">
            <input id="phone" placeholder="Phone">
        </div>

        <button class="login-btn" onclick="login()">Login</button>
        <button class="login-btn" onclick="goAdmin()">Admin Panel</button>

        <div class="typing-box">
            <div class="typing t1">👋 Hello Client</div>
            <div class="typing t2">🍔 Welcome to Fast Food</div>
            <div class="typing t3">🎉 Enjoy Ordering</div>
        </div>

    </div>

    <script>
        function goAdmin() {
            window.location.href = "admin.html";
        }

        function login() {
            localStorage.setItem("name", document.getElementById("name").value);
            localStorage.setItem("address", document.getElementById("address").value);
            localStorage.setItem("phone", document.getElementById("phone").value);

            window.location.href = "shop.html";
        }
    </script>

</body>

</html>
