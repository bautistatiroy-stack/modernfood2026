<!DOCTYPE html>
<html>

<head>
    <title>Modern Admin Panel</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
        
        body {
            background: #fff7ed;
        }
        /* HEADER */
        
        .topbar {
            background: linear-gradient(45deg, #ea580c, #f97316);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .topbar h1 {
            font-size: 28px;
        }
        
        .logout-btn {
            background: #dc2626;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        /* LOGIN */
        
        .login-box {
            max-width: 420px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        
        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ea580c;
        }
        
        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #ccc;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ea580c, #fb923c);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .back-btn {
            width: 100%;
            padding: 14px 10px;
            margin-top: 1px;
            margin-bottom: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ea580c, #fb923c);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .back-btn:hover {
            background: linear-gradient(45deg, #4cf205, #b75404);
            transform: scale(1.07);
        }
        /* DASHBOARD */
        
        .dashboard {
            display: none;
            padding: 20px;
        }
        /* STATS */
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .stat-card h3 {
            color: #777;
            margin-bottom: 10px;
        }
        
        .stat-card h1 {
            color: #ea580c;
            font-size: 32px;
        }
        /* MAIN */
        
        .main {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }
        /* FORM */
        
        .form-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }
        
        .form-box h2 {
            margin-bottom: 20px;
            color: #ea580c;
        }
        
        .form-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 14px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        
        .add-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #16a34a, #0af9e1);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .add-btn:hover {
            transform: scale(1.03);
        }
        /* FOOD CARDS */
        
        .foods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .card {
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }
        
        .card-content {
            padding: 18px;
        }
        
        .food-tag {
            display: inline-block;
            background: #ffedd5;
            color: #ea580c;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .card h3 {
            margin-bottom: 10px;
        }
        
        .price {
            color: #16a34a;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .stock {
            color: #666;
            margin-bottom: 15px;
        }
        
        .remove-btn {
            width: 100%;
            padding: 1px;
            border: none;
            border-radius: 10px;
            background: #dc2626;
            color: white;
            cursor: pointer;
        }
        
        .remove-btn:hover {
            background: darkred;
        }
        
        @media(max-width:850px) {
            .main {
                grid-template-columns: 1fr;
            }
            .topbar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
        
        @media(max-width:500px) {
            .title {
                font-size: 30px;
            }
            .products {
                gap: 10px;
            }
            .card img {
                height: 110px;
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
        
        body {
            background: #f4f4f4;
            padding: 10px 1px;
            background: #c77700;
        }
        /* HEADER */
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 4px;
            font-weight: bold;
        }
        
        .cart-btn {
            background: #eedf05;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        /* PRODUCT GRID */
        
        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        /* CARD */
        
        .card {
            background: #dcdcdc;
            border-radius: 12px;
            overflow: hidden;
            padding-bottom: 12px;
        }
        /* IMAGE */
        
        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            background: #bc8f8f;
        }
        /* CONTENT */
        
        .content {
            padding: 1px;
        }
        
        .name {
            font-size: 8px;
            margin-bottom: 5px;
        }
        
        .price {
            font-size: 7px;
            margin-bottom: 3px;
        }
        
        .stock {
            font-size: 13px;
            margin-bottom: 10px;
        }
        /* QTY */
        
        .qty-box {
            width: 100%;
            padding: 1px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
            font-size: 13px;
        }
        /* BUTTON */
        
        .add-btn {
            width: 100%;
            border: none;
            background: #c77700;
            color: white;
            padding: 10px;
            border-radius: 20px;
            font-size: px;
            cursor: pointer;
        }
        
        .add-btn:hover {
            opacity: 0.9;
        }
        /* MOBILE */
        
        @media(max-width:500px) {
            .title {
                font-size: 30px;
            }
            .products {
                gap: 10px;
            }
            .card img {
                height: 110px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box" id="loginBox">

        <h2>🍔 Food Admin Login</h2>


        <input type="text" id="adminUser" placeholder="Username">
        <input type="password" id="adminPass" placeholder="Password">
        <input type="email" id="adminEmail" placeholder="Email">

        <div>
            <button class="back-btn" onclick="goShop()">
            back
 </button>

            <button class="back-btn" onclick="loginAdmin()">
            Login
        </button>

            <div id="adminPanel" style="display:none;">


                <h1>🛒 Admin Dashboard</h1>
                <button class="logout-btn" onclick="logoutAdmin()">
                Logout
            </button>

                <div class="container">

                    <div class="form-box">

                        <h2>Add Product</h2>

                        <input id="name" placeholder="Product Name">

                        <input id="price" type="number" placeholder="Price">

                        <input id="stock" type="number" placeholder="Stock">

                        <input id="img" placeholder="Image URL">

                        <button class="add-btn" onclick="addProduct()">
                Add Product
            </button>
                    </div>

                    <div class="products" id="list"></div>

                </div>

                <script src="admin.js"></script>
                <script>
                    function goShop() {
                        window.location.href = "index.html";
                    }

                    let products =
                        JSON.parse(localStorage.getItem("products")) || [];

                    function addProduct() {

                        let name =
                            document.getElementById("name").value;

                        let price =
                            document.getElementById("price").value;

                        let stock =
                            document.getElementById("stock").value;

                        let img =
                            document.getElementById("img").value;

                        if (!name || !price || !stock || !img) {
                            alert("Complete all fields!");
                            return;
                        }

                        products.push({
                            name,
                            price: Number(price),
                            stock: Number(stock),
                            img
                        });

                        localStorage.setItem(
                            "products",
                            JSON.stringify(products)
                        );

                        render();

                        document.getElementById("name").value = "";
                        document.getElementById("price").value = "";
                        document.getElementById("stock").value = "";
                        document.getElementById("img").value = "";

                        alert("Product Added!");
                    }

                    function render() {

                        let html = "";

                        products.forEach((p, i) => {

                            html += `
                
                <div class="card">

                    <img src="${p.img}">

                    <div class="card-content">

                        <h3>${p.name}</h3>

                        <div class="price">
                            ₱${p.price}
                        </div>

                        <p>Stock:</p>

                        <input
                            class="stock-input"
                            type="number"
                            value="${p.stock}"
                            onchange="updateStock(${i}, this.value)"
                        >

                        <button
                            class="remove-btn"
                            onclick="deleteItem(${i})"
                        >
                            Remove
                        </button>

                    </div>

                </div>
                `;
                        });

                        document.getElementById("list").innerHTML = html;
                    }

                    function updateStock(i, value) {

                        products[i].stock = Number(value);

                        localStorage.setItem(
                            "products",
                            JSON.stringify(products)
                        );
                    }

                    function deleteItem(i) {

                        let confirmDelete =
                            confirm("Delete this product?");

                        if (!confirmDelete) return;

                        products.splice(i, 1);

                        localStorage.setItem(
                            "products",
                            JSON.stringify(products)
                        );

                        render();
                    }

                    render();
                </script>

</body>

</html>
